<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>S13 — Rekap &amp; Pelacakan Penanggung Jawab | SIPRK Universitas Brawijaya</title>
  <link rel="icon" type="image/png" href="../assets/logo-ub.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../assets/siprk-session.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #E6ECF5;
      color: #1B2733;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#E6ECF5]">

  <div class="w-full max-w-[430px] min-h-screen bg-[#F5F7FA] flex flex-col relative pb-24 shadow-[0_0_40px_rgba(20,50,92,0.15)] border-x border-[#c2c6d3]/60">

    <!-- Top App Bar -->
    <header class="sticky top-0 z-40 bg-[#14325C] text-white px-4 h-14 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-white/10 p-1 border border-white/20 flex items-center justify-center">
          <img src="../assets/logo-ub.png" alt="Logo UB" class="w-full h-full object-contain"/>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="text-base font-extrabold tracking-tight leading-none">SIPRK Rekap</span>
            <span class="px-1.5 py-0.5 rounded text-[9px] font-bold bg-[#FFF0C2] text-[#8C6000]">S13</span>
          </div>
          <span class="text-[10px] text-[#c5daff] block mt-0.5">Pelacakan Penanggung Jawab (ADM-09)</span>
        </div>
      </div>
      <button onclick="exportRekap('Excel')" type="button" class="h-9 px-3 rounded-lg bg-[#1F5FA8] hover:bg-[#004788] text-white text-xs font-semibold flex items-center gap-1 shadow-xs">
        <span class="material-symbols-outlined text-[16px]">download</span>
        <span>Ekspor</span>
      </button>
    </header>

    <!-- Filter Ruangan + Tanggal (ADM-09) -->
    <section class="bg-white border-b border-[#E6E9ED] px-4 py-3.5 space-y-3">
      <div>
        <h1 class="text-base font-extrabold text-[#14325C]">Rekap &amp; Pelacakan Pemakaian Ruang</h1>
        <p class="text-[11px] text-[#6B7785]">Filter ruangan dan tanggal untuk melacak kontak PIC kegiatan</p>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-[10px] font-bold uppercase text-[#6B7785] mb-1">Pilih Ruangan</label>
          <select id="rekap-room" onchange="renderRekap()" class="w-full h-10 px-2.5 rounded-lg border border-[#c2c6d3] text-xs font-medium text-[#1B2733]">
            <option value="all">Semua Ruangan</option>
            <option value="Ruang Teori 1.2">Ruang Teori 1.2 (GKB-A)</option>
            <option value="Ruang Teori 2.1">Ruang Teori 2.1 (GKB-A)</option>
            <option value="Lab Jarkom 3.4">Lab Jarkom 3.4 (FILKOM)</option>
            <option value="Aula Kecil Lt. 1">Aula Kecil Lt. 1</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-[#6B7785] mb-1">Tanggal Pemakaian</label>
          <input id="rekap-date" type="date" value="2026-10-19" onchange="renderRekap()" class="w-full h-10 px-2.5 rounded-lg border border-[#c2c6d3] text-xs font-medium text-[#1B2733]"/>
        </div>
      </div>
    </section>

    <!-- Rekap List -->
    <main id="rekap-list" class="flex-1 px-4 py-3 space-y-3">
      <!-- Populated dynamically -->
    </main>

    <!-- Modal Detail Kontak PIC -->
    <div id="pic-modal" class="fixed inset-0 z-50 hidden bg-[#14325C]/50 backdrop-blur-xs flex items-end justify-center">
      <div class="w-full max-w-[430px] bg-white rounded-t-2xl p-5 space-y-4 shadow-2xl">
        <div class="flex items-center justify-between border-b border-[#E6E9ED] pb-3">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-[#1F5FA8]">Log Penanggung Jawab (PIC)</span>
            <h3 id="pic-modal-name" class="text-base font-bold text-[#14325C]">Rani Maharani</h3>
          </div>
          <button onclick="document.getElementById('pic-modal').classList.add('hidden')" type="button" class="w-8 h-8 rounded-full flex items-center justify-center text-[#6B7785]">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div id="pic-modal-body" class="space-y-2.5 text-xs"></div>
        <button onclick="document.getElementById('pic-modal').classList.add('hidden')" type="button" class="w-full h-11 rounded-xl bg-[#1F5FA8] text-white font-bold text-xs">
          Tutup Detail
        </button>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav id="siprk-bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto z-40 h-16 bg-white border-t border-[#E6E9ED] shadow-[0_-2px_10px_rgba(20,50,92,0.06)] flex items-center justify-around px-1"></nav>
  </div>

  <script>
    let currentRekapItems = [];

    function renderRekap() {
      const rFilt = document.getElementById('rekap-room').value;
      const list = document.getElementById('rekap-list');
      const allBookings = window.SIPRK ? window.SIPRK.getBookings() : [];
      currentRekapItems = allBookings
        .filter(b => b.status !== 'draft')
        .filter(b => rFilt === 'all' || b.roomName === rFilt);

      if (currentRekapItems.length === 0) {
        list.innerHTML = `<div class="bg-white rounded-xl p-8 text-center border border-[#E6E9ED] text-xs text-[#6B7785]">Tidak ada data pemakaian ruangan pada filter ini.</div>`;
        return;
      }

      list.innerHTML = currentRekapItems.map((item, idx) => {
        const statusLabel = item.status === 'disetujui' ? 'Disetujui' : item.status === 'pending' ? 'Pending' : item.status === 'konflik' ? 'Konflik' : 'Ditolak';
        const statusColor = item.status === 'disetujui' ? 'bg-[#D8F1E4] text-[#2E9E6B]' : item.status === 'pending' ? 'bg-[#FFF0C2] text-[#8C6000]' : 'bg-[#F9DADD] text-[#D64550]';
        return `
          <article onclick="openPicDetail(${idx})" class="bg-white rounded-xl border border-[#E6E9ED] p-3.5 shadow-2xs hover:border-[#1F5FA8] cursor-pointer space-y-2">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-[10px] font-mono font-bold text-[#1F5FA8]">${item.id}</span>
                <h3 class="text-xs font-bold text-[#14325C] mt-0.5">${item.title}</h3>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusColor}">${statusLabel}</span>
            </div>
            <div class="text-[11px] text-[#424751] space-y-1 bg-[#F5F7FA] p-2.5 rounded-lg border border-[#E6E9ED]">
              <div class="flex items-center justify-between">
                <span class="font-semibold text-[#1B2733]">${item.roomName} (${item.building})</span>
                <span>${item.dateLabel} • ${item.startTime} - ${item.endTime}</span>
              </div>
              <div class="flex items-center justify-between text-[#6B7785]">
                <span>PIC: <strong class="text-[#14325C]">${item.applicantName}</strong></span>
                <span class="text-[#1F5FA8] font-semibold">Detail Kontak →</span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function openPicDetail(idx) {
      const item = currentRekapItems[idx];
      if (!item) return;
      document.getElementById('pic-modal-name').textContent = item.applicantName;
      document.getElementById('pic-modal-body').innerHTML = `
        <div class="bg-[#F5F7FA] p-3 rounded-xl border border-[#E6E9ED] space-y-2">
          <div class="flex justify-between"><span class="text-[#6B7785]">Unit / Peran:</span><span class="font-semibold">${item.unit || item.applicantRole}</span></div>
          <div class="flex justify-between"><span class="text-[#6B7785]">NIM / NIP:</span><span class="font-mono font-semibold">${item.applicantId}</span></div>
          <div class="flex justify-between"><span class="text-[#6B7785]">WhatsApp:</span><a href="https://wa.me/6281234567890" target="_blank" class="font-bold text-[#2E9E6B] underline">${item.phone || '0812-3456-7890'}</a></div>
          <div class="flex justify-between"><span class="text-[#6B7785]">Email UB:</span><span class="font-medium">${item.email || '-'}</span></div>
          <div class="flex justify-between pt-2 border-t border-[#E6E9ED]"><span class="text-[#6B7785]">Kegiatan:</span><span class="font-semibold text-right">${item.title}</span></div>
          <div class="flex justify-between"><span class="text-[#6B7785]">Ruangan &amp; Jam:</span><span class="font-semibold">${item.roomName} (${item.startTime} - ${item.endTime})</span></div>
        </div>
      `;
      document.getElementById('pic-modal').classList.remove('hidden');
    }

    function exportRekap(fmt) {
      const rows = [['Kode Booking', 'Kegiatan', 'Ruangan', 'Tanggal', 'Jam', 'PIC', 'NIM/NIP', 'Kontak', 'Status']];
      currentRekapItems.forEach(item => {
        rows.push([item.id, item.title, item.roomName, item.dateLabel, `${item.startTime}-${item.endTime}`, item.applicantName, item.applicantId, item.phone || '-', item.status]);
      });
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Rekap_Pemakaian_Ruang_UB_2026.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    window.addEventListener('DOMContentLoaded', renderRekap);
    window.addEventListener('siprk:db-synced', renderRekap);
  </script>
  <script src="../assets/siprk-nav.js"></script>
</body>
</html>
