<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Jadwal &amp; Ketersediaan Ruangan — SIPRK UB</title>
  <link rel="icon" type="image/png" href="../assets/logo-ub.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="../assets/siprk-session.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #E6ECF5;
      color: #111d28;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#E6ECF5]">

  <div class="w-full max-w-[430px] min-h-screen bg-[#F5F7FA] flex flex-col relative pb-40 shadow-sm border-x border-[#E6E9ED]">

    <!-- Top App Bar -->
    <header class="sticky top-0 z-40 flex justify-between items-center px-4 h-14 bg-white border-b border-[#E6E9ED] shadow-2xs">
      <div class="flex items-center gap-2.5">
        <a href="s02-beranda.html" class="w-9 h-9 rounded-xl bg-[#14325C] p-1 flex items-center justify-center shadow-xs">
          <img src="../assets/logo-ub.png" alt="Logo UB" class="w-full h-full object-contain"/>
        </a>
        <div>
          <span class="text-base font-extrabold tracking-tight text-[#004788] leading-none">SIPRK</span>
          <span class="text-[10px] text-[#6B7785] block mt-0.5">Universitas Brawijaya</span>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <a href="s15-notifikasi.html" aria-label="Notifikasi" class="relative p-2 text-[#424751] hover:bg-[#edf4ff] rounded-full transition-colors">
          <span class="material-symbols-outlined text-[22px]">notifications</span>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="w-full pt-3 px-4 flex flex-col space-y-3.5">

      <!-- Title & Live Indicator -->
      <section class="flex items-center justify-between">
        <div>
          <h1 class="text-lg text-[#111d28] font-extrabold leading-tight">Jadwal &amp; Ketersediaan</h1>
          <p class="text-xs text-[#6B7785]">Pilih slot waktu hijau untuk mengajukan peminjaman</p>
        </div>
        <div class="flex items-center gap-1.5 bg-white border border-[#E6E9ED] px-2.5 py-1 rounded-full">
          <span class="w-2 h-2 rounded-full bg-[#2E9E6B] animate-pulse"></span>
          <span class="text-[10px] text-[#424751] font-semibold">Live</span>
        </div>
      </section>

      <!-- Search & Filter Chips (JDW-02 & JDW-05) -->
      <section class="space-y-2">
        <div class="relative flex items-center w-full">
          <span class="material-symbols-outlined absolute left-3 text-[#6B7785] text-[20px]">search</span>
          <input id="jadwal-search" oninput="renderRoomCards()" type="text" placeholder="Cari nama ruangan atau gedung (GKB, FILKOM)..." class="w-full h-11 pl-10 pr-4 bg-white border border-[#c2c6d3] rounded-xl text-xs text-[#111d28] focus:outline-none focus:ring-2 focus:ring-[#1F5FA8]"/>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
          <button onclick="setBuildingFilter('all')" id="bfilt-all" class="px-3 py-1 rounded-full text-xs font-semibold bg-[#1F5FA8] text-white shrink-0">Semua Gedung</button>
          <button onclick="setBuildingFilter('GKB-A')" id="bfilt-GKB-A" class="px-3 py-1 rounded-full text-xs font-medium bg-white border border-[#c2c6d3] text-[#424751] shrink-0">GKB-A</button>
          <button onclick="setBuildingFilter('FILKOM')" id="bfilt-FILKOM" class="px-3 py-1 rounded-full text-xs font-medium bg-white border border-[#c2c6d3] text-[#424751] shrink-0">FILKOM</button>
          <button onclick="setBuildingFilter('Dekanat')" id="bfilt-Dekanat" class="px-3 py-1 rounded-full text-xs font-medium bg-white border border-[#c2c6d3] text-[#424751] shrink-0">Dekanat</button>
          <button onclick="toggleFacilityFilter('Smartboard')" id="ffilt-Smartboard" class="px-3 py-1 rounded-full text-xs font-medium bg-white border border-[#c2c6d3] text-[#424751] shrink-0 flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">tv</span> Smartboard
          </button>
          <button onclick="resetAllJadwalFilters()" class="text-xs text-[#1F5FA8] font-bold hover:underline shrink-0 px-2">Reset</button>
        </div>
      </section>

      <!-- Date Strip Selector (BR-01) -->
      <section class="bg-white border border-[#E6E9ED] rounded-2xl p-3 shadow-2xs">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-[#111d28] flex items-center gap-1">
            <span class="material-symbols-outlined text-[16px] text-[#1F5FA8]">calendar_today</span>
            Oktober 2026
          </span>
          <span id="rule-h1-badge" class="text-[10px] font-semibold text-[#D64550] bg-[#F9DADD]/60 px-2 py-0.5 rounded">
            Minimal H-1 (Mahasiswa)
          </span>
        </div>
        <div id="date-strip-container" class="flex items-center justify-between gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      </section>

      <!-- Status Legend Mini -->
      <section class="bg-white border border-[#E6E9ED] rounded-xl px-3 py-2 flex items-center justify-around text-[10px] font-semibold text-[#111d28]">
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#2E9E6B]"></span> Tersedia</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#D64550]"></span> Terpakai / Terisi</div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#6B7785]"></span> Maintenance</div>
      </section>

      <!-- Dynamic Room Cards List -->
      <section id="jadwal-rooms-container" class="flex flex-col space-y-3.5"></section>

    </main>

    <!-- Sticky Selected Slot Bar (JDW-03) -->
    <div class="fixed bottom-16 left-0 right-0 max-w-[430px] mx-auto z-40 px-3 pb-2 pointer-events-none">
      <div class="bg-white border border-[#c2c6d3] rounded-2xl p-3 shadow-lg pointer-events-auto flex items-center justify-between gap-2">
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-1.5">
            <span id="sticky-slot-dot" class="w-2 h-2 rounded-full bg-[#2E9E6B]"></span>
            <span id="sticky-slot-date" class="text-[10px] font-bold text-[#2E9E6B] uppercase">Kam, 22 Okt 2026</span>
          </div>
          <p id="sticky-slot-room" class="text-xs text-[#111d28] font-extrabold truncate">Ruang Teori 1.2 (08:40 - 10:20)</p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="goToSelectedRoomDetail()" type="button" class="h-10 px-2.5 rounded-xl border border-[#1F5FA8] text-[#1F5FA8] font-bold text-xs hover:bg-[#DCEBFA]/40">
            Detail
          </button>
          <button id="btn-sticky-submit" onclick="proceedToBookingForm()" type="button" class="h-10 px-3.5 bg-[#1F5FA8] hover:bg-[#14325C] disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold text-xs rounded-xl flex items-center gap-1 shadow-xs">
            <span>Ajukan Pinjam</span>
            <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Role-Adaptive Bottom Nav -->
    <nav id="siprk-bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto w-full z-50 h-16 bg-white border-t border-[#E6E9ED] shadow-sm flex items-center justify-around px-1"></nav>
  </div>

  <script>
    const datesList = [
      { day: 'Sen', num: '19', full: '2026-10-19', label: 'Senin, 19 Okt 2026', isToday: true },
      { day: 'Sel', num: '20', full: '2026-10-20', label: 'Selasa, 20 Okt 2026', isToday: false },
      { day: 'Rab', num: '21', full: '2026-10-21', label: 'Rabu, 21 Okt 2026', isToday: false },
      { day: 'Kam', num: '22', full: '2026-10-22', label: 'Kamis, 22 Okt 2026', isToday: false },
      { day: 'Jum', num: '23', full: '2026-10-23', label: 'Jumat, 23 Okt 2026', isToday: false },
      { day: 'Sab', num: '24', full: '2026-10-24', label: 'Sabtu, 24 Okt 2026', isToday: false }
    ];

    let selectedBuilding = 'all';
    let requireSmartboard = false;
    let selectedDateObj = datesList[3]; // Default Kamis 22 Okt
    let selectedRoomId = 'rt-102';
    let selectedTimeRange = '08:40 - 10:20';

    function renderDateStrip() {
      const s = window.SIPRK.getSession();
      const isDosen = s.role === 'dosen';
      const ruleBadge = document.getElementById('rule-h1-badge');

      if (isDosen) {
        ruleBadge.textContent = 'Prioritas Dosen: H-0 Diizinkan';
        ruleBadge.className = 'text-[10px] font-bold text-[#2E9E6B] bg-[#D8F1E4] px-2 py-0.5 rounded';
      }

      const strip = document.getElementById('date-strip-container');
      strip.innerHTML = datesList.map((d, idx) => {
        const locked = d.isToday && !isDosen;
        const active = selectedDateObj.full === d.full;
        if (locked) {
          return `
            <div title="Pengajuan mahasiswa minimal H-1" class="flex flex-col items-center justify-center min-w-[48px] py-2 px-1 rounded-xl bg-[#E6E9ED]/60 text-[#6B7785] opacity-60 cursor-not-allowed">
              <span class="text-[10px] font-medium">${d.day}</span>
              <span class="text-sm font-bold">${d.num}</span>
              <span class="text-[8px] uppercase font-bold">H-0</span>
            </div>
          `;
        }
        return `
          <button onclick="selectDate(${idx})" type="button" class="flex flex-col items-center justify-center min-w-[50px] py-2 px-1 rounded-xl transition-all ${active ? 'bg-[#1F5FA8] text-white font-bold shadow-xs' : 'bg-[#F5F7FA] border border-[#E6E9ED] text-[#111d28] hover:border-[#1F5FA8]'}">
            <span class="text-[10px] opacity-90">${d.day}</span>
            <span class="text-sm font-extrabold mt-0.5">${d.num}</span>
            <span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white' : 'bg-transparent'} mt-0.5"></span>
          </button>
        `;
      }).join('');
    }

    function selectDate(idx) {
      selectedDateObj = datesList[idx];
      ensureValidSelectedSlot();
      renderDateStrip();
      updateStickyBar();
      renderRoomCards();
    }

    function setBuildingFilter(b) {
      selectedBuilding = b;
      ['all', 'GKB-A', 'FILKOM', 'Dekanat'].forEach(k => {
        const btn = document.getElementById('bfilt-' + k);
        if (btn) {
          btn.className = (k === b)
            ? 'px-3 py-1 rounded-full text-xs font-semibold bg-[#1F5FA8] text-white shrink-0'
            : 'px-3 py-1 rounded-full text-xs font-medium bg-white border border-[#c2c6d3] text-[#424751] shrink-0';
        }
      });
      renderRoomCards();
    }

    function toggleFacilityFilter(fac) {
      requireSmartboard = !requireSmartboard;
      const btn = document.getElementById('ffilt-Smartboard');
      btn.className = requireSmartboard
        ? 'px-3 py-1 rounded-full text-xs font-semibold bg-[#1F5FA8] text-white shrink-0 flex items-center gap-1'
        : 'px-3 py-1 rounded-full text-xs font-medium bg-white border border-[#c2c6d3] text-[#424751] shrink-0 flex items-center gap-1';
      renderRoomCards();
    }

    function resetAllJadwalFilters() {
      document.getElementById('jadwal-search').value = '';
      requireSmartboard = false;
      document.getElementById('ffilt-Smartboard').className = 'px-3 py-1 rounded-full text-xs font-medium bg-white border border-[#c2c6d3] text-[#424751] shrink-0 flex items-center gap-1';
      setBuildingFilter('all');
    }

    function ensureValidSelectedSlot() {
      const rooms = window.SIPRK.getRooms();
      const currentRoom = rooms.find(r => r.id === selectedRoomId);
      if (currentRoom && currentRoom.status === 'tersedia' && selectedTimeRange) {
        const parts = selectedTimeRange.split(' - ');
        if (parts.length === 2) {
          const check = window.SIPRK.checkSlotConflict(currentRoom.id, selectedDateObj.full, parts[0], parts[1]);
          if (!check.conflict) return true;
        }
      }

      // Cari slot tersedia pertama pada ruangan saat ini
      if (currentRoom && currentRoom.status === 'tersedia') {
        const freeOnCurrent = getSlotsForRoomAndDate(currentRoom, selectedDateObj).find(sl => !sl.conflict && sl.status === 'tersedia');
        if (freeOnCurrent) {
          selectedTimeRange = freeOnCurrent.time;
          return true;
        }
      }

      // Fallback cari slot tersedia di ruangan lain
      for (const r of rooms) {
        if (r.status !== 'tersedia') continue;
        const freeSlot = getSlotsForRoomAndDate(r, selectedDateObj).find(sl => !sl.conflict && sl.status === 'tersedia');
        if (freeSlot) {
          selectedRoomId = r.id;
          selectedTimeRange = freeSlot.time;
          return true;
        }
      }

      selectedTimeRange = '';
      return false;
    }

    function selectRoomSlot(roomId, timeRange) {
      const parts = String(timeRange || '').split(' - ');
      if (parts.length !== 2) return;
      const check = window.SIPRK.checkSlotConflict(roomId, selectedDateObj.full, parts[0], parts[1]);
      if (check.conflict) return;
      selectedRoomId = roomId;
      selectedTimeRange = timeRange;
      updateStickyBar();
      renderRoomCards();
    }

    function updateStickyBar() {
      const room = window.SIPRK.getRoomById(selectedRoomId);
      const dotEl = document.getElementById('sticky-slot-dot');
      const dateEl = document.getElementById('sticky-slot-date');
      const roomEl = document.getElementById('sticky-slot-room');
      const submitBtn = document.getElementById('btn-sticky-submit');

      const parts = String(selectedTimeRange || '').split(' - ');
      const hasValid = room && room.status === 'tersedia' && parts.length === 2 && !window.SIPRK.checkSlotConflict(room.id, selectedDateObj.full, parts[0], parts[1]).conflict;

      if (!hasValid) {
        if (dotEl) dotEl.className = 'w-2 h-2 rounded-full bg-[#D64550]';
        if (dateEl) {
          dateEl.textContent = `Penuh • ${selectedDateObj.label}`;
          dateEl.className = 'text-[10px] font-bold text-[#D64550] uppercase';
        }
        if (roomEl) roomEl.textContent = 'Semua slot waktu pada tanggal ini terisi';
        if (submitBtn) submitBtn.disabled = true;
        return;
      }

      if (dotEl) dotEl.className = 'w-2 h-2 rounded-full bg-[#2E9E6B]';
      if (dateEl) {
        dateEl.textContent = `Tersedia • ${selectedDateObj.label}`;
        dateEl.className = 'text-[10px] font-bold text-[#2E9E6B] uppercase';
      }
      if (roomEl) roomEl.textContent = `${room.name} (${selectedTimeRange})`;
      if (submitBtn) submitBtn.disabled = false;

      window.SIPRK.setSelectedSlot({
        roomId: room.id,
        roomCode: room.code,
        roomName: room.name,
        building: `${room.building} • ${room.floor}`,
        capacity: room.capacity,
        date: selectedDateObj.full,
        dateFormatted: selectedDateObj.label,
        startTime: parts[0],
        endTime: parts[1]
      });
    }

    function goToSelectedRoomDetail(customRoomId) {
      const rId = customRoomId || selectedRoomId;
      const room = window.SIPRK.getRoomById(rId);
      const roomSlots = getSlotsForRoomAndDate(room, selectedDateObj);
      const firstFree = roomSlots.find(sl => !sl.conflict && sl.status === 'tersedia');
      const chosenTime = (rId === selectedRoomId && selectedTimeRange) ? selectedTimeRange : (firstFree ? firstFree.time : '');
      const parts = chosenTime.split(' - ');
      window.SIPRK.setSelectedSlot({
        roomId: room.id,
        roomCode: room.code,
        roomName: room.name,
        building: `${room.building} • ${room.floor}`,
        capacity: room.capacity,
        date: selectedDateObj.full,
        dateFormatted: selectedDateObj.label,
        startTime: parts[0] || '',
        endTime: parts[1] || ''
      });
      window.location.href = `s04-detail-ruangan.html?room=${encodeURIComponent(room.id)}`;
    }

    function proceedToBookingForm() {
      if (!ensureValidSelectedSlot()) return;
      updateStickyBar();
      window.location.href = 's05-form-peminjaman.html';
    }

    function getSlotsForRoomAndDate(room, dateObj) {
      return window.SIPRK.getRoomSlotsForDate(room, dateObj.full);
    }

    function renderRoomCards() {
      const q = (document.getElementById('jadwal-search').value || '').toLowerCase();
      const rooms = window.SIPRK.getRooms();
      const cont = document.getElementById('jadwal-rooms-container');

      const filtered = rooms.filter(r => {
        const matchBld = selectedBuilding === 'all' || r.buildingShort === selectedBuilding;
        const matchFac = !requireSmartboard || r.facilities.includes('Smartboard');
        const matchQ = !q || r.name.toLowerCase().includes(q) || r.building.toLowerCase().includes(q) || r.code.toLowerCase().includes(q);
        return matchBld && matchFac && matchQ;
      });

      if (filtered.length === 0) {
        cont.innerHTML = `
          <div class="bg-white rounded-2xl border border-[#E6E9ED] p-8 text-center space-y-2.5">
            <span class="material-symbols-outlined text-4xl text-[#6B7785]">search_off</span>
            <h3 class="text-sm font-bold text-[#14325C]">Tidak Ada Ruangan yang Cocok</h3>
            <p class="text-xs text-[#6B7785]">Coba kurangi filter fasilitas atau pilih gedung lain.</p>
            <button onclick="resetAllJadwalFilters()" type="button" class="px-4 py-2 rounded-xl bg-[#1F5FA8] text-white text-xs font-bold">Reset Filter</button>
          </div>
        `;
        return;
      }

      cont.innerHTML = filtered.map(r => {
        const isMaint = r.status === 'maintenance';
        const dynamicSlots = getSlotsForRoomAndDate(r, selectedDateObj);
        return `
          <article class="bg-white border border-[#E6E9ED] rounded-2xl p-3.5 shadow-2xs space-y-2.5">
            <div class="flex items-start justify-between pb-2 border-b border-[#E6E9ED]">
              <div>
                <div class="flex items-center gap-2">
                  <button onclick="goToSelectedRoomDetail('${r.id}')" type="button" class="text-sm font-extrabold text-[#14325C] hover:text-[#1F5FA8] text-left">${r.name}</button>
                  <span class="bg-[#DCEBFA] text-[#1F5FA8] text-[10px] font-bold px-2 py-0.5 rounded">${r.code}</span>
                </div>
                <p class="text-xs text-[#6B7785] flex items-center gap-1 mt-0.5">
                  <span class="material-symbols-outlined text-[14px] text-[#1F5FA8]">location_on</span>
                  ${r.building} (${r.floor}) • ${r.capacity} Kursi
                </p>
              </div>
              <button onclick="goToSelectedRoomDetail('${r.id}')" type="button" class="text-xs font-semibold text-[#1F5FA8] hover:underline flex items-center">
                Detail <span class="material-symbols-outlined text-[15px]">chevron_right</span>
              </button>
            </div>

            <!-- Facilities -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar text-[11px] text-[#424751]">
              ${r.facilities.map(f => `<span class="px-2 py-0.5 rounded-md bg-[#F5F7FA] border border-[#E6E9ED] shrink-0">${f}</span>`).join('')}
            </div>

            ${isMaint ? `
              <div class="p-3 rounded-xl bg-[#E6E9ED] text-[#424751] text-xs flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">build</span>
                <span><strong>Maintenance:</strong> ${r.maintenanceNote || 'Ruangan sedang dalam pemeliharaan sarpras.'}</span>
              </div>
            ` : `
              <div>
                <span class="text-[10px] font-bold text-[#6B7785] uppercase tracking-wider block mb-1.5">Pilih Slot Waktu (${selectedDateObj.label}):</span>
                <div class="flex items-stretch gap-2 overflow-x-auto no-scrollbar pb-1">
                  ${dynamicSlots.map(sl => {
                    const isAvailable = !sl.conflict && sl.status === 'tersedia';
                    const isSelected = isAvailable && (selectedRoomId === r.id && selectedTimeRange === sl.time);
                    if (!isAvailable) {
                      return `
                        <div title="${(sl.fullDetail || sl.shortLabel || '').replace(/"/g, '&quot;')}" class="min-w-[148px] max-w-[175px] p-2.5 rounded-2xl bg-[#F9DADD]/50 border border-[#D64550]/40 shrink-0 select-none cursor-not-allowed">
                          <div class="flex items-center justify-between text-[#D64550]">
                            <span class="text-xs font-bold">${sl.time}</span>
                            <span class="material-symbols-outlined text-[17px]">cancel</span>
                          </div>
                          <span class="text-[11px] font-bold text-[#93000a] block mt-1.5 truncate leading-tight">${sl.shortLabel || 'Sudah Terpakai'}</span>
                        </div>
                      `;
                    }
                    if (isSelected) {
                      return `
                        <button onclick="selectRoomSlot('${r.id}', '${sl.time}')" type="button" class="min-w-[130px] p-2.5 rounded-2xl bg-[#1F5FA8] text-white border-2 border-[#14325C] text-left shrink-0 shadow-xs">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold">${sl.time}</span>
                            <span class="material-symbols-outlined text-[16px]">task_alt</span>
                          </div>
                          <span class="text-[11px] font-bold block mt-1.5">Slot Terpilih</span>
                        </button>
                      `;
                    }
                    return `
                      <button onclick="selectRoomSlot('${r.id}', '${sl.time}')" type="button" class="min-w-[130px] p-2.5 rounded-2xl bg-[#D8F1E4]/70 hover:bg-[#D8F1E4] border border-[#2E9E6B]/40 text-left shrink-0 transition-all">
                        <div class="flex items-center justify-between text-[#2E9E6B]">
                          <span class="text-xs font-bold">${sl.time}</span>
                          <span class="material-symbols-outlined text-[16px]">check_circle</span>
                        </div>
                        <span class="text-[11px] font-bold text-[#2E9E6B] block mt-1.5">Tersedia • Pilih</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `}
          </article>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await window.SIPRK.syncFromServer();
      ensureValidSelectedSlot();
      renderDateStrip();
      updateStickyBar();
      renderRoomCards();
    });
  </script>
